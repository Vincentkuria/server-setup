
name: Server Setup (Debian)

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Username to create'
        required: true
      server_host:
        description: 'Server IP or hostname'
        required: true
      user_password:
        description: 'the user password for accessing root'
        required: true

jobs:
  setup-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create user and setup basic configuration
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ github.event.inputs.server_host }}
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          useradd -m -s /bin/bash ${{ github.event.inputs.username }}
          echo "${{ github.event.inputs.username }}:${{ github.event.inputs.user_password }}" | chpasswd
          usermod -aG sudo ${{ github.event.inputs.username }}
          echo "User ${{ github.event.inputs.username }} created successfully"

    - name: Setup SSH access for new user
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ github.event.inputs.server_host }}
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          mkdir -p /home/${{ github.event.inputs.username }}/.ssh
          chmod 700 /home/${{ github.event.inputs.username }}/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/${{ github.event.inputs.username }}/.ssh/authorized_keys
          chmod 600 /home/${{ github.event.inputs.username }}/.ssh/authorized_keys
          chown -R ${{ github.event.inputs.username }}:${{ github.event.inputs.username }} /home/${{ github.event.inputs.username }}/.ssh
          echo "SSH access configured for ${{ github.event.inputs.username }}"

    - name: Install and configure Nginx
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ github.event.inputs.server_host }}
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          apt-get update
          apt-get install -y nginx
          systemctl start nginx
          systemctl enable nginx
          systemctl status nginx --no-pager
          echo "Nginx installed and configured"

    - name: Install Docker using official apt repository
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ github.event.inputs.server_host }}
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Remove old versions if any
          apt-get update
          apt-get remove -y docker.io docker-doc docker-compose podman-docker containerd runc || true

          # Install prerequisites
          apt-get install -y ca-certificates curl gnupg lsb-release

          # Add Docker’s official GPG key
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc

          # Set up the repository (fix expansion bug)
          echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian \
          $(. /etc/os-release; echo $VERSION_CODENAME) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null

          # Install Docker Engine
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

          # Enable and start Docker
          systemctl enable docker
          systemctl start docker

          # Add new user to docker group
          usermod -aG docker ${{ github.event.inputs.username }}

          # Test Docker installation
          docker --version
          docker run hello-world || true

          echo "Docker installed successfully using official repository"


    - name: Final verification and cleanup
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ github.event.inputs.server_host }}
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "=== Final Setup Verification ==="
          echo "✅ User created: $(id ${{ github.event.inputs.username }})"
          echo "✅ User groups: $(groups ${{ github.event.inputs.username }})"
          echo "✅ SSH key added: $(ls -la /home/${{ github.event.inputs.username }}/.ssh/)"
          echo "✅ Nginx status: $(systemctl is-active nginx)"
          echo "✅ Docker status: $(systemctl is-active docker)"

    - name: Configure SSH security settings
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ github.event.inputs.server_host }}
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cp /etc/ssh/sshd_config /etc/ssh/sshd_config.backup
          sed -i 's/#PermitRootLogin yes/PermitRootLogin no/' /etc/ssh/sshd_config
          sed -i 's/PermitRootLogin yes/PermitRootLogin no/' /etc/ssh/sshd_config
          sed -i 's/#PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
          sed -i 's/PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
          sed -i 's/#PubkeyAuthentication yes/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          sshd -t
          systemctl restart sshd
          echo "SSH security configuration updated"
          echo ""
          echo "🎉 Server setup completed successfully!"
          echo "You can now SSH to the server using:"
          echo "ssh ${{ github.event.inputs.username }}@${{ github.event.inputs.server_host }}"
